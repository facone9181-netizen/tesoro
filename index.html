<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tesoro</title>
<meta name="theme-color" content="#7a2f52">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tesoro">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ── Tesoro(테소로): 마음에 닿은 말들을 보석처럼 간직하는 공간 ──
   레이아웃: 중앙 단일 컬럼. 잠금 → 이달의 보석(추천) → 검색 → 책 상세(메모).
   팔레트: 상아빛 종이 바탕 + 자수정/석류 쥬얼톤 + 금(金) 강조. */
:root{
  --bg:#f4ece0;
  --surface:#fffdf8;
  --surface-2:#faf3e7;
  --ink:#2c2330;
  --muted:#857783;
  --line:#e7dccb;
  --jewel:#7a2f52;        /* 석류-자수정 */
  --jewel-2:#3f2b52;
  --gold:#a9792f;
  --gold-soft:#cda45e;
  --good:#4f7a52;
  --shadow:rgba(70,45,55,.16);
  --radius:14px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16111b;
    --surface:#211a28;
    --surface-2:#1b1521;
    --ink:#f1e7df;
    --muted:#b2a2ae;
    --line:#352a3e;
    --jewel:#d587ac;
    --jewel-2:#b89bde;
    --gold:#d9b877;
    --gold-soft:#e8cf9a;
    --good:#8fc093;
    --shadow:rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16111b;
  --surface:#211a28;
  --surface-2:#1b1521;
  --ink:#f1e7df;
  --muted:#b2a2ae;
  --line:#352a3e;
  --jewel:#d587ac;
  --jewel-2:#b89bde;
  --gold:#d9b877;
  --gold-soft:#e8cf9a;
  --good:#8fc093;
  --shadow:rgba(0,0,0,.55);
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Noto Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  font-size:15px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer}
.serif{font-family:"Gowun Batang","Nanum Myeongjo",serif}
.word{font-family:"Cormorant Garamond","Gowun Batang",serif}

.wrap{
  max-width:860px;margin:0 auto;
  padding-left:max(18px,env(safe-area-inset-left,0px));
  padding-right:max(18px,env(safe-area-inset-right,0px));
}

/* ── 공통 버튼 ── */
.btn{
  border:none;border-radius:999px;padding:12px 22px;font-size:15px;font-weight:700;
  background:var(--jewel);color:#fff;letter-spacing:.02em;
  transition:transform .08s ease, filter .15s ease;
}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:500}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ── 잠금 화면 ── */
#lock{min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  display:flex;align-items:center;justify-content:center}
.lockcard{
  text-align:center;max-width:390px;width:100%;
  background:var(--surface);border:1px solid var(--line);border-radius:22px;
  padding:42px 30px;box-shadow:0 18px 50px -24px var(--shadow);
}
.emblem{font-size:30px;color:var(--gold);line-height:1}
.brand{font-size:52px;font-weight:600;letter-spacing:.01em;margin:10px 0 2px;color:var(--jewel)}
.brand-sub{font-size:12px;letter-spacing:.5em;color:var(--gold);margin-bottom:20px;padding-left:.5em}
.tagline{color:var(--muted);font-size:13.5px;line-height:1.7;margin:0 0 26px;font-family:"Gowun Batang",serif}
.pwrow{display:flex;gap:8px}
.pwrow input{
  flex:1;min-width:0;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);
  border-radius:999px;padding:12px 18px;font-size:15px;
}
.hint{margin-top:16px;font-size:12px;color:var(--muted);min-height:18px}
.hint.err{color:var(--jewel);font-weight:500}

/* ── 헤더 ── */
header.bar{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  background:color-mix(in srgb,var(--bg) 86%,transparent);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.bar-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:13px}
.logo{display:flex;align-items:baseline;gap:9px;background:none;border:none;padding:0;cursor:pointer;font-family:inherit}
.logo b{font-size:27px;font-weight:600;letter-spacing:.01em;color:var(--jewel)}
.logo span{font-size:10px;letter-spacing:.3em;color:var(--gold)}
.bar-actions{display:flex;gap:6px;align-items:center}
.icon-btn{border:1px solid var(--line);background:var(--surface);color:var(--muted);
  border-radius:999px;width:38px;height:38px;display:grid;place-items:center;font-size:16px}

main{padding-block:26px 60px}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:0 0 16px}
.section-head h2{font-size:22px;font-weight:700;margin:0;color:var(--ink)}
.eyebrow{font-size:11px;letter-spacing:.34em;color:var(--gold);text-transform:uppercase;margin:0 0 4px}
.month-tag{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

/* ── 검색 ── */
.search-block{margin:0 0 40px}
.searchbar{display:flex;gap:8px;margin-top:4px}
.searchbar input{
  flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:999px;padding:13px 20px;font-size:15px;
}

/* ── 책 그리드 / 카드 ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px}
.book{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px;text-align:left;width:100%;color:inherit;
  display:flex;flex-direction:column;gap:10px;
  box-shadow:0 10px 26px -20px var(--shadow);transition:transform .1s ease, box-shadow .15s ease;
}
.book:hover{transform:translateY(-3px);box-shadow:0 18px 34px -22px var(--shadow)}
.cover{
  aspect-ratio:2/3;width:100%;border-radius:8px;overflow:hidden;background:var(--surface-2);
  border:1px solid var(--line);position:relative;
}
.cover img{width:100%;height:100%;object-fit:cover}
.cover.empty::after{content:"표지 없음";position:absolute;inset:0;display:grid;place-items:center;
  color:var(--muted);font-size:11px;letter-spacing:.1em}
.book-t{font-weight:700;font-size:14.5px;line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.book-a{font-size:12.5px;color:var(--muted);
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.pick-note{font-size:12.5px;color:var(--jewel-2);line-height:1.5;border-top:1px dashed var(--line);padding-top:8px;
  font-family:"Gowun Batang",serif}

/* featured 추천 카드(조금 크게) */
.featured .grid{grid-template-columns:repeat(auto-fill,minmax(168px,1fr))}
.featured .book{border-color:color-mix(in srgb,var(--gold) 40%,var(--line))}

/* ── 상세 ── */
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--muted);
  font-size:14px;padding:4px 0;margin:0 0 18px}
.detail-top{display:flex;gap:22px;margin:0 0 30px}
.detail-top .cover{width:150px;flex:none}
.d-meta{min-width:0;display:flex;flex-direction:column;gap:8px}
.d-title{font-family:"Gowun Batang",serif;font-size:26px;font-weight:700;line-height:1.3;margin:0}
.d-author{color:var(--muted);font-size:14px}
.d-desc{font-size:13.5px;color:var(--muted);line-height:1.65;
  display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.d-link{font-size:12.5px;color:var(--gold);text-decoration:none;align-self:flex-start;border-bottom:1px solid currentColor}
.d-isbn{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.d-isbn b{font-weight:600;color:var(--ink);letter-spacing:.02em}
.copy-btn{border:1px solid var(--line);background:var(--surface-2);color:var(--muted);border-radius:999px;padding:3px 11px;font-size:11.5px;font-family:inherit}
.copy-btn:hover{color:var(--jewel);border-color:var(--jewel)}
.memo-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:2px}
.memo-acts{display:flex;gap:6px;align-items:center}
.confirm-q{font-size:11.5px;color:var(--jewel);margin-right:2px}
.mini-btn{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:3px 11px;font-size:11.5px;font-family:inherit}
.mini-btn:hover{color:var(--jewel);border-color:var(--jewel)}
.mini-btn.del:hover{color:#c0453f;border-color:#c0453f}
.edit-area{width:100%;margin:8px 0 6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:9px 11px;font-family:"Gowun Batang",serif;font-size:14px;line-height:1.6;resize:vertical;min-height:62px}
.edit-bar{display:flex;gap:6px;margin-bottom:4px}

.memo-write{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:0 0 26px}
.memo-write label{font-size:12px;letter-spacing:.2em;color:var(--gold);text-transform:uppercase}
.memo-write textarea{
  width:100%;margin-top:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);
  border-radius:10px;padding:12px 14px;font-family:inherit;font-size:14.5px;line-height:1.6;resize:vertical;min-height:84px;
}
.memo-write .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
.count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

.memo-list{display:flex;flex-direction:column;gap:12px}
.memo{background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--gold);
  border-radius:10px;padding:13px 15px}
.memo .no{font-size:11px;color:var(--gold);letter-spacing:.14em;font-weight:700}
.memo .txt{white-space:pre-wrap;word-break:break-word;margin:5px 0 6px;font-size:14.5px;
  font-family:"Gowun Batang",serif;line-height:1.7}
.memo .meta{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}

/* ── 상태 표시 ── */
.state{text-align:center;color:var(--muted);padding:34px 10px;font-size:14px}
.spinner{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--gold);
  border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.setup-note{max-width:520px;margin:30px auto;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:22px;font-size:13.5px;color:var(--muted);line-height:1.7}
.setup-note b{color:var(--jewel)}
.setup-note code{background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;
  font-family:ui-monospace,monospace;font-size:12.5px;color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;
  background:var(--jewel-2);color:#fff;padding:11px 20px;border-radius:999px;font-size:13.5px;font-weight:500;
  box-shadow:0 10px 30px -10px var(--shadow);opacity:0;pointer-events:none;transition:opacity .25s ease}
.toast.show{opacity:1}

@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition:none!important}}
@media (max-width:520px){
  .detail-top{flex-direction:row;gap:16px}
  .detail-top .cover{width:112px}
  .d-title{font-size:21px}
  .brand{font-size:44px}
}
</style>
</head>
<body>

<!-- ───────── 잠금 화면 ───────── -->
<section id="lock">
  <div class="wrap">
    <div class="lockcard">
      <div class="emblem serif">❖</div>
      <div class="brand word">Tesoro</div>
      <div class="brand-sub">테소로</div>
      <p class="tagline">마음에 닿은 말들을 보석처럼<br>하나씩 골라 소중히 간직한 공간.</p>
      <form class="pwrow" id="lockForm">
        <input id="pw" type="password" inputmode="text" autocomplete="current-password"
               placeholder="비밀번호를 입력하세요" aria-label="비밀번호">
        <button class="btn" type="submit" id="enterBtn">들어가기</button>
      </form>
      <p class="hint" id="lockHint" role="status">&nbsp;</p>
    </div>
  </div>
</section>

<!-- ───────── 메인 ───────── -->
<div id="app" hidden>
  <header class="bar">
    <div class="wrap bar-in">
      <button type="button" class="logo" id="homeBtn" aria-label="홈으로"><b class="word">Tesoro</b><span>테소로</span></button>
      <div class="bar-actions">
        <button class="icon-btn" id="themeBtn" title="밝게/어둡게" aria-label="밝게/어둡게">◐</button>
        <button class="icon-btn" id="lockBtn" title="잠그기" aria-label="잠그기">⌧</button>
      </div>
    </div>
  </header>

  <!-- 목록(추천 + 검색) -->
  <main id="home" class="wrap">
    <section class="search-block">
      <p class="eyebrow">찾아보기</p>
      <form class="searchbar" id="searchForm">
        <input id="q" type="search" placeholder="책 제목이나 저자를 검색하세요" aria-label="책 검색">
        <button class="btn" type="submit">검색</button>
      </form>
      <div id="searchResult"></div>
    </section>

    <section id="recommend" class="featured"></section>
  </main>

  <!-- 책 상세 + 메모 -->
  <main id="detail" class="wrap" hidden></main>
</div>

<div class="toast" id="toast"></div>

<script>
/* =======================================================================
   설정: 아래 API_URL 한 줄만 본인 앱스스크립트 웹앱 주소로 바꾸세요.
   (설정안내.md 참고)  예) 'https://script.google.com/macros/s/AKfy..../exec'
   ======================================================================= */
const API_URL = "https://script.google.com/macros/s/AKfycbxpAKdduIBRDCqcjhZkEDnEYYTBvU19jLRtObedG_EVSg409BxV6sz_KU4TPbzXAZaN/exec";

/* ---------------- 유틸 ---------------- */
const $ = (s, r=document) => r.querySelector(s);
const el = (tag, cls, txt) => { const e=document.createElement(tag); if(cls)e.className=cls; if(txt!=null)e.textContent=txt; return e; };
const esc = (s) => String(s==null?'':s);

let PW = "";
try { PW = sessionStorage.getItem('tesoro_pw') || ""; } catch(e){}
let ROLE = "";
try { ROLE = sessionStorage.getItem('tesoro_role') || ""; } catch(e){}
// 익명 식별자: 내 기기가 남긴 메모만 수정·삭제하기 위한 랜덤 ID (화면엔 안 보임)
let UID = "";
try { UID = localStorage.getItem('tesoro_uid') || ""; } catch(e){}
if(!UID){
  UID = 'u_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36);
  try { localStorage.setItem('tesoro_uid', UID); } catch(e){}
}

function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2200);
}

function configured(){
  return API_URL && !API_URL.startsWith("여기에");
}

async function api(payload){
  if(!configured()) throw new Error('not_configured');
  const body = JSON.stringify(Object.assign({ pw: PW, uid: UID }, payload));
  const res = await fetch(API_URL, {
    method:'POST',
    headers:{ 'Content-Type':'text/plain;charset=utf-8' },
    body, redirect:'follow'
  });
  if(!res.ok) throw new Error('http_'+res.status);
  return res.json();
}

/* ---------------- 테마 ---------------- */
(function initTheme(){
  let saved=null; try{ saved=localStorage.getItem('tesoro_theme'); }catch(e){}
  if(saved) document.documentElement.setAttribute('data-theme',saved);
  $('#themeBtn').addEventListener('click',()=>{
    const cur=document.documentElement.getAttribute('data-theme');
    const isDark = cur==='dark' || (!cur && matchMedia('(prefers-color-scheme:dark)').matches);
    const next=isDark?'light':'dark';
    document.documentElement.setAttribute('data-theme',next);
    try{ localStorage.setItem('tesoro_theme',next); }catch(e){}
  });
})();

/* ---------------- 잠금 / 로그인 ---------------- */
const lockEl=$('#lock'), appEl=$('#app');

function showApp(){
  lockEl.hidden=true; appEl.hidden=false;
  const sb=document.querySelector('.search-block');
  if(sb) sb.hidden = (ROLE!=='admin');   // 회원은 검색창 숨김
  loadRecommend();
}
function showLock(){
  appEl.hidden=true; lockEl.hidden=false;
  $('#pw').value=''; $('#pw').focus();
}

$('#lockForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const hint=$('#lockHint'); hint.className='hint'; hint.textContent='';
  const pw=$('#pw').value.trim();
  if(!pw) return;
  if(!configured()){
    showSetupNote();
    return;
  }
  const btn=$('#enterBtn'); btn.disabled=true; hint.textContent='확인 중…';
  try{
    const r=await loginReq(pw);
    if(r && r.ok){
      PW=pw; ROLE=r.role||'member';
      try{ sessionStorage.setItem('tesoro_pw',pw); sessionStorage.setItem('tesoro_role',ROLE); }catch(e){}
      hint.textContent=''; showApp();
    }else{
      hint.className='hint err'; hint.textContent='비밀번호가 맞지 않아요.';
    }
  }catch(err){
    hint.className='hint err';
    hint.textContent='서버에 연결하지 못했어요. 주소 설정을 확인해 주세요.';
  }finally{ btn.disabled=false; }
});

async function loginReq(pw){
  const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({action:'login',pw}),redirect:'follow'});
  return res.json();
}

$('#lockBtn').addEventListener('click',()=>{
  PW=''; ROLE='';
  try{ sessionStorage.removeItem('tesoro_pw'); sessionStorage.removeItem('tesoro_role'); }catch(e){}
  showLock();
});

// 로고 클릭 → 홈(목록)으로
$('#homeBtn').addEventListener('click',()=>{
  $('#detail').hidden=true; $('#home').hidden=false; window.scrollTo(0,0);
});

function showSetupNote(){
  lockEl.hidden=true; appEl.hidden=false;
  $('#recommend').innerHTML='';
  $('#searchResult').innerHTML=
    '<div class="setup-note">'+
    '<b>아직 서버가 연결되지 않았어요.</b><br>'+
    'index.html 파일 안의 <code>API_URL</code> 값을 본인 앱스스크립트 웹앱 주소로 바꾸면 '+
    '추천도서·검색·메모가 모두 작동해요. 자세한 방법은 <code>설정안내.md</code>를 참고하세요.'+
    '</div>';
}

/* ---------------- 책 카드 ---------------- */
function bookCard(b, opts){
  opts=opts||{};
  const card=el('button','book');
  card.type='button';
  const cover=el('div','cover'+(b.cover?'':' empty'));
  if(b.cover){ const img=el('img'); img.src=b.cover; img.alt=esc(b.title)+' 표지';
    img.loading='lazy'; img.onerror=()=>{cover.classList.add('empty'); img.remove();}; cover.appendChild(img); }
  card.appendChild(cover);
  card.appendChild(el('div','book-t',esc(b.title)));
  if(b.author) card.appendChild(el('div','book-a',esc(b.author)));
  if(opts.note && b.comment) card.appendChild(el('div','pick-note','“'+esc(b.comment)+'”'));
  card.addEventListener('click',()=>openDetail(b));
  return card;
}

/* ---------------- 추천도서 ---------------- */
function renderRecommend(months){
  const box=$('#recommend');
  if(!months || !months.length){
    box.innerHTML='<p class="eyebrow">이달의 보석</p>'+
      '<div class="state">아직 추천도서가 없어요.<br>구글시트 ‘추천도서’ 탭에 책을 추가하면 이곳에 나타나요.</div>';
    return;
  }
  const ms=months.slice().sort((a,b)=>monthKey(b.month).localeCompare(monthKey(a.month)));
  box.innerHTML='';
  ms.forEach((m,idx)=>{
    const head=el('div','section-head');
    const left=el('div');
    left.appendChild(el('p','eyebrow', idx===0?'이달의 보석':'지난 달의 보석'));
    left.appendChild(el('h2',null, prettyMonth(m.month)+' 추천도서'));
    head.appendChild(left);
    box.appendChild(head);
    const grid=el('div','grid');
    m.books.forEach(b=>grid.appendChild(bookCard(b,{note:true})));
    box.appendChild(grid);
    if(idx<ms.length-1){ const sp=el('div'); sp.style.height='34px'; box.appendChild(sp); }
  });
}

async function loadRecommend(){
  const box=$('#recommend');
  // 1) 캐시가 있으면 즉시 표시(빠른 체감)
  let cached=null;
  try{ cached=JSON.parse(localStorage.getItem('tesoro_recommend')||'null'); }catch(e){}
  if(cached && cached.months){ renderRecommend(cached.months); }
  else { box.innerHTML='<div class="state"><div class="spinner"></div>이달의 보석을 꺼내는 중…</div>'; }
  // 2) 최신 내용으로 갱신
  try{
    const r=await api({action:'recommend'});
    if(r && r.ok && r.months){
      try{ localStorage.setItem('tesoro_recommend',JSON.stringify({months:r.months})); }catch(e){}
      renderRecommend(r.months);
    } else if(!cached){
      renderRecommend(null);
    }
  }catch(err){
    if(!cached) box.innerHTML='<p class="eyebrow">이달의 보석</p><div class="state">불러오지 못했어요. 잠시 후 다시 시도해 주세요.</div>';
  }
}
// 추천월을 'YYYY-MM' 키로 정규화 (시트가 날짜로 바꿔 긴 문자열이 와도 처리)
function monthKey(m){
  m=String(m||'').trim();
  const mm=/(\d{4})\D+(\d{1,2})(?!\d)/.exec(m);
  if(mm && +mm[2]>=1 && +mm[2]<=12) return mm[1]+'-'+String(mm[2]).padStart(2,'0');
  const d=new Date(m);
  if(!isNaN(d.getTime())) return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  return m;
}
function prettyMonth(m){
  const k=monthKey(m);
  const mm=/^(\d{4})-(\d{2})$/.exec(k);
  return mm ? (mm[1]+'년 '+Number(mm[2])+'월') : esc(m);
}
// 출판일 'YYYYMMDD'/'YYYY-MM-DD' 등을 'YYYY.MM'으로
function fmtPub(d){
  d=String(d||'').trim();
  const m=/(\d{4})\D?(\d{2})/.exec(d);
  return m ? (m[1]+'.'+m[2]) : d;
}

/* ---------------- 검색 ---------------- */
$('#searchForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const q=$('#q').value.trim();
  const box=$('#searchResult');
  if(!q){ box.innerHTML=''; return; }
  box.innerHTML='<div class="state"><div class="spinner"></div>‘'+esc(q)+'’ 찾는 중…</div>';
  try{
    const r=await api({action:'search', q});
    if(!r || !r.ok){ box.innerHTML='<div class="state">검색에 실패했어요.</div>'; return; }
    if(!r.items || !r.items.length){ box.innerHTML='<div class="state">검색 결과가 없어요.</div>'; return; }
    box.innerHTML='';
    const head=el('div','section-head');
    head.appendChild(el('h2',null,'검색 결과'));
    head.appendChild(el('span','month-tag',r.items.length+'권'));
    box.appendChild(head);
    const grid=el('div','grid');
    r.items.forEach(b=>grid.appendChild(bookCard(b)));
    box.appendChild(grid);
  }catch(err){
    box.innerHTML='<div class="state">검색 중 오류가 났어요.</div>';
  }
});

/* ---------------- 책 상세 + 메모 ---------------- */
async function openDetail(b){
  const home=$('#home'), det=$('#detail');
  home.hidden=true; det.hidden=false;
  window.scrollTo(0,0);

  det.innerHTML='';
  const back=el('button','back','‹ 돌아가기'); back.type='button';
  back.addEventListener('click',()=>{ det.hidden=true; home.hidden=false; });
  det.appendChild(back);

  const top=el('div','detail-top');
  const cover=el('div','cover'+(b.cover?'':' empty'));
  if(b.cover){ const img=el('img'); img.src=b.cover; img.alt=esc(b.title)+' 표지';
    img.onerror=()=>{cover.classList.add('empty'); img.remove();}; cover.appendChild(img); }
  top.appendChild(cover);
  const meta=el('div','d-meta');
  meta.appendChild(el('h1','d-title',esc(b.title)));
  const sub=[b.author,b.publisher,fmtPub(b.pubDate)].filter(Boolean).join(' · ');
  meta.appendChild(el('div','d-author',sub));
  // 관리자만 ISBN·설명·YES24 링크를 봄 (회원은 표지·제목·저자·메모만)
  if(ROLE==='admin'){
    if(b.isbn13 && String(b.isbn13).indexOf('T:')!==0){
      const row=el('div','d-isbn');
      row.appendChild(el('span',null,'ISBN'));
      const code=el('b',null,esc(b.isbn13));
      row.appendChild(code);
      const cp=el('button','copy-btn','복사'); cp.type='button';
      cp.addEventListener('click',()=>{
        const done=(t)=>{ cp.textContent=t; setTimeout(()=>cp.textContent='복사',1600); };
        if(navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(String(b.isbn13)).then(()=>done('복사됨 ✓')).catch(()=>selectIsbn());
        } else { selectIsbn(); }
        function selectIsbn(){
          try{ const r=document.createRange(); r.selectNodeContents(code);
            const s=getSelection(); s.removeAllRanges(); s.addRange(r); done('길게 눌러 복사'); }
          catch(e){ done('복사'); }
        }
      });
      row.appendChild(cp);
      meta.appendChild(row);
    }
    if(b.description) meta.appendChild(el('div','d-desc',esc(b.description)));
    if(b.link){ const a=el('a','d-link','YES24에서 보기 ↗'); a.href=b.link; a.target='_blank'; a.rel='noopener'; meta.appendChild(a); }
  }
  top.appendChild(meta);
  det.appendChild(top);

  // 메모 작성
  const write=el('div','memo-write');
  write.innerHTML='<label for="memoInput">메모 남기기 · 익명</label>';
  const ta=el('textarea'); ta.id='memoInput'; ta.maxLength=1000;
  ta.placeholder='이 책에 대한 생각을 자유롭게 적어 주세요. 누가 썼는지는 보이지 않아요.';
  write.appendChild(ta);
  const row=el('div','row');
  const cnt=el('span','count','0 / 1000');
  const save=el('button','btn','보석함에 담기'); save.type='button';
  row.appendChild(cnt); row.appendChild(save);
  write.appendChild(row);
  det.appendChild(write);
  ta.addEventListener('input',()=>cnt.textContent=ta.value.length+' / 1000');

  // 메모 목록
  const listWrap=el('div');
  const lh=el('div','section-head'); lh.appendChild(el('h2',null,'남겨진 메모'));
  const lhCount=el('span','month-tag',''); lh.appendChild(lhCount);
  listWrap.appendChild(lh);
  const list=el('div','memo-list'); listWrap.appendChild(list);
  det.appendChild(listWrap);

  const isbn = b.isbn13 || b.isbn || ('T:'+b.title);

  async function refresh(){
    list.innerHTML='<div class="state"><div class="spinner"></div>메모를 불러오는 중…</div>';
    try{
      const r=await api({action:'memos', isbn});
      const memos=(r&&r.memos)||[];
      lhCount.textContent = memos.length? memos.length+'개' : '';
      if(!memos.length){ list.innerHTML='<div class="state">아직 남겨진 메모가 없어요. 첫 메모를 담아 주세요.</div>'; return; }
      list.innerHTML='';
      memos.forEach((m,i)=>{
        const mw=el('div','memo');
        mw.appendChild(el('div','no','No.'+(i+1)));
        const txt=el('div','txt',esc(m.text));
        mw.appendChild(txt);
        const foot=el('div','memo-foot');
        foot.appendChild(el('span','meta', m.ts?esc(m.ts):''));
        if(m.mine && m.memoId){
          const acts=el('span','memo-acts');
          const eb=el('button','mini-btn','수정'); eb.type='button';
          const db=el('button','mini-btn del','삭제'); db.type='button';
          eb.addEventListener('click',()=>startEdit(mw, m, txt));
          db.addEventListener('click',()=>{
            acts.innerHTML='';
            acts.appendChild(el('span','confirm-q','삭제할까요?'));
            const yes=el('button','mini-btn del','삭제'); yes.type='button';
            const no=el('button','mini-btn','취소'); no.type='button';
            acts.appendChild(yes); acts.appendChild(no);
            no.addEventListener('click',()=>refresh());
            yes.addEventListener('click',()=>doDelete(m));
          });
          acts.appendChild(eb); acts.appendChild(db);
          foot.appendChild(acts);
        }
        mw.appendChild(foot);
        list.appendChild(mw);
      });
    }catch(err){ list.innerHTML='<div class="state">메모를 불러오지 못했어요.</div>'; }
  }

  // 내 메모 수정 (인라인)
  function startEdit(mw, m, txtEl){
    if(mw.querySelector('.edit-area')) return;
    const ta2=el('textarea','edit-area'); ta2.value=m.text; ta2.maxLength=1000;
    txtEl.hidden=true;
    mw.insertBefore(ta2, txtEl.nextSibling);
    const bar=el('div','edit-bar');
    const sv=el('button','mini-btn','저장'); sv.type='button';
    const cc=el('button','mini-btn','취소'); cc.type='button';
    bar.appendChild(sv); bar.appendChild(cc);
    mw.insertBefore(bar, ta2.nextSibling);
    ta2.focus();
    cc.addEventListener('click',()=>{ ta2.remove(); bar.remove(); txtEl.hidden=false; });
    sv.addEventListener('click', async ()=>{
      const t=ta2.value.trim(); if(!t) return;
      sv.disabled=true; sv.textContent='저장 중…';
      try{
        const r=await api({action:'editMemo', memoId:m.memoId, text:t});
        if(r && r.ok){ toast('메모를 수정했어요 ✎'); refresh(); }
        else { toast('수정에 실패했어요.'); sv.disabled=false; sv.textContent='저장'; }
      }catch(e){ toast('수정 중 오류가 났어요.'); sv.disabled=false; sv.textContent='저장'; }
    });
  }

  // 내 메모 삭제
  async function doDelete(m){
    try{
      const r=await api({action:'deleteMemo', memoId:m.memoId});
      if(r && r.ok){ toast('메모를 삭제했어요'); refresh(); }
      else { toast('삭제에 실패했어요.'); }
    }catch(e){ toast('삭제 중 오류가 났어요.'); }
  }

  save.addEventListener('click', async ()=>{
    const text=ta.value.trim();
    if(!text){ ta.focus(); return; }
    save.disabled=true; save.textContent='담는 중…';
    try{
      const r=await api({action:'addMemo', isbn, title:b.title, text});
      if(r && r.ok){ ta.value=''; cnt.textContent='0 / 1000'; toast('메모를 담았어요 ❖'); refresh(); }
      else { toast('저장에 실패했어요.'); }
    }catch(err){ toast('저장 중 오류가 났어요.'); }
    finally{ save.disabled=false; save.textContent='보석함에 담기'; }
  });

  refresh();
}
